version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: switchme-postgres
    environment:
      POSTGRES_DB: switchme_dev
      POSTGRES_USER: switchme_user
      POSTGRES_PASSWORD: switchme_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchme_user -d switchme_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
