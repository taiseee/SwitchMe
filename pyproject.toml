[project]
name = "switchme"
version = "0.1.0"
description = "SwithMe - Self-management support service with milestone tracking and penalty system"
requires-python = ">=3.12.2"
dependencies = [
    "alembic>=1.18.1",
    "asyncpg>=0.31.0",
    "authlib>=1.4.0",
    "fastapi>=0.128.0",
    "greenlet>=3.3.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.21",
    "sqlalchemy>=2.0.46",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "psycopg2-binary>=2.9.9",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "anyio: mark test as an anyio test",
]

[tool.anyio]
backends = ["asyncio"]
